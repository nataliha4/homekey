<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeKey v2</title>
<!-- Installable app (backlog #2): own name, icon and full-screen window when added to the home screen -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1724">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HomeKey v2">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column, centered; the path scrolls, a chapter is a card above a piano keyboard. Single dark look by choice. */
:root {
  color-scheme: dark;
  --bg: #0F1724;
  --surface: #1A2536;
  --surface-2: #141D2C;
  --line: #2B3A52;
  --fg: #F4F1EA;
  --soft: #C9D2E0;
  --muted: #A9B4C6;
  --accent: #F5B841;
  --accent-ink: #1A1300;
  --ok: #6AD1C7;
  --ok-bg: #12333A;
  --warn: #FF9A5C;
  --warn-bg: #3A2418;
  --ivory: #F4F1EA;
  --ebony: #0B111B;
  --display: 'Outfit', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
.app { max-width: 430px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 32px; display: flex; flex-direction: column; gap: 20px; }
button { font-family: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--ok); outline-offset: 3px; }
a { color: var(--ok); }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.15; text-wrap: balance; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; line-height: 1.4; }
.stack { display: flex; flex-direction: column; }

/* Name mark */
.mark { display: flex; align-items: center; align-self: flex-start; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
.mark .clef { font-size: 27px; line-height: 1; margin-right: 10px; }
.mark .tile { width: 27px; height: 37px; box-sizing: border-box; border-right: 2px solid var(--bg); border-radius: 0 0 4px 4px; background: var(--ivory); color: var(--bg); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 9px; font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1; }
.mark .tile.on { background: var(--accent); }

.lead { margin: 0; font-size: 17px; line-height: 1.5; color: var(--muted); }
.how { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.how li { display: flex; align-items: center; gap: 12px; line-height: 1.35; }
.how .ico { flex: none; width: 28px; text-align: center; font-size: 22px; }

.welcome-card { position: relative; margin-top: 34px; }
.greeter { position: absolute; right: 26px; top: -83px; width: 62px; height: 96px; }

/* Buttons */
.btn { min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); font-size: 16px; font-weight: 700; padding: 10px 16px; cursor: pointer; }
.btn.ready { border-color: var(--accent); color: var(--accent); }
#next, #demo, #groove, .song .btn { transition: border-color 1s ease, color 1s ease, background-color 1s ease; }
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.quiet { min-height: 44px; border-color: transparent; background: transparent; color: var(--muted); font-size: 14px; padding: 8px 10px; }
.btn:hover { filter: brightness(1.08); }

/* Path */
.progress { height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; }
.progress > div { height: 8px; border-radius: 4px; background: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1.2; }
.trail { position: relative; height: 416px; }
.trail .dot { position: absolute; width: 6px; height: 6px; border-radius: 3px; background: #4A5E7E; }
.node { position: absolute; width: 68px; height: 68px; box-sizing: border-box; border-radius: 34px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 20px; background: var(--bg); border: 2px solid var(--line); color: var(--muted); padding: 0; }
button.node { cursor: pointer; }
.node.current { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 22px; box-shadow: 0 0 0 7px rgba(245, 184, 65, 0.22); }
.node.done { border-color: var(--ok); color: var(--ok); }
.node.current.waiting { background: var(--bg); color: var(--accent); box-shadow: none; } /* 1a before the intro: available, not the next thing to do */
.node-label { position: absolute; display: flex; flex-direction: column; gap: 2px; }
.node-label .t { font-size: 15px; font-weight: 700; color: var(--soft); }
.node-label .s { font-size: 13px; color: var(--muted); }
button.node-label { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; align-items: flex-start; text-align: left; }
button.node-label[style*="text-align: right"] { align-items: flex-end; }
.node-label.live .t { font-size: 16px; color: var(--fg); }
.node-label.live .s { font-weight: 700; color: var(--accent); }
.node-label.live.done .s { color: var(--ok); }
.locked { min-height: 72px; box-sizing: border-box; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.locked .num { flex: none; width: 40px; height: 40px; box-sizing: border-box; border-radius: 20px; border: 2px solid var(--line); color: var(--muted); font-family: var(--display); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.locked .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.locked .name { font-weight: 700; line-height: 1.25; color: var(--soft); }
.locked svg { flex: none; }
.reset-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* Chapter */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper { display: flex; flex-direction: column; gap: 2px; }
.stepper .line { display: flex; align-items: center; margin: 0 -9px; }
.stop { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; }
button.stop { cursor: pointer; }
.dot { width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.dot.done { border-color: var(--ok); color: var(--ok); }
button.stop:hover .dot { background: var(--ok-bg); }
.dot.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px rgba(245, 184, 65, 0.18); }
.seg { flex: 1; height: 2px; margin: 0 -9px; background: var(--line); }
.seg.done { background: var(--ok); }
.cap { font-size: 14px; font-weight: 700; color: var(--muted); }
.cap b { color: var(--fg); }
.step { min-height: 330px; }
.step p { margin: 0; }
.step p.idea { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.15; text-wrap: balance; }
.song { border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.song .head { display: flex; align-items: center; gap: 12px; }
.song .icon { font-size: 24px; }
.song .name { font-weight: 700; }
.song .btn { min-height: 48px; font-size: 15px; }
.song .btn.ready { background: var(--surface); }
.song .spotify { align-self: center; padding: 4px 8px; font-size: 13px; color: var(--muted); text-underline-offset: 3px; }
.song .spotify:hover { color: var(--soft); }
.song .spot { display: flex; flex-direction: column; align-items: stretch; }
.song .spot > .spotify { align-self: center; }
.song button.spotify { background: none; border: 0; cursor: pointer; font-family: inherit; text-decoration: underline; }
.song .spotbtn { min-height: 48px; font-size: 15px; background: var(--surface); animation: appear 0.6s ease; }
.song .spotbtn.primary { background: var(--accent); }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
.song .spot iframe { display: block; width: 100%; border: 0; border-radius: 12px; }
.choices { display: flex; gap: 10px; }
.choice { flex: 1; min-height: 112px; padding: 12px 6px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.choice { transition: border-color 0.6s ease; }
.choices.go .choice { border-color: var(--accent); }
.listening { min-height: 18px; margin: -6px 0; font-weight: 700; color: var(--accent); opacity: 0; transition: opacity 0.4s ease; }
.listening.on { opacity: 1; }
.btn.skip { align-self: center; min-height: 40px; }
.btn.hear { align-self: center; min-height: 40px; text-decoration: underline; text-underline-offset: 3px; }
.choice b { font-family: var(--display); font-size: 22px; }
.choice span { font-size: 13px; color: var(--muted); }
.choice .emo { font-size: 28px; line-height: 1; color: inherit; }
.choice .emo.white { filter: brightness(0) invert(1); } /* dark emoji (footprints) shown white for contrast */
.choices.three { gap: 8px; }
.choices.three .choice b { font-size: 19px; }
.choice.right { border-color: var(--ok); background: var(--ok-bg); }
.choice.wrong { border-color: var(--warn); background: var(--warn-bg); }
.feedback { font-weight: 700; }
.feedback.good { color: var(--ok); }
.feedback.bad { color: var(--warn); }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grow { flex: 1; }
.recap-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }

.scene { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
.scene svg { display: block; width: 100%; height: auto; max-height: 150px; }

/* The talking character: a speech bubble inside the scene */
button.scene.talk { display: block; width: 100%; cursor: pointer; font: inherit; color: inherit; }
.talk .i-bars, .talk .i-replay, .talk .i-dots, .talk .mouth, .talk .ring { display: none; }
.talk[data-voice="idle"] .ring { display: inline; opacity: 0; }
.talk svg { overflow: visible; }
/* Words next to the bubble, because an icon alone is easy to miss */
.talk .tap { visibility: hidden; font-size: 12px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.talk[data-voice="idle"] .tap { visibility: visible; }
button.scene.talk { position: relative; }
.scene.talk > .tap { position: absolute; left: 12px; bottom: 10px; background: var(--ivory); color: var(--bg); border-radius: 999px; padding: 5px 11px; }
.guide .who { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.guide .tap { color: var(--fg); transition: color 0.8s ease; }
.guide[data-cta="1"] .tap { color: var(--accent); }
.talk[data-voice="speaking"] .i-play, .talk[data-voice="done"] .i-play, .talk[data-voice="loading"] .i-play { display: none; }
.talk[data-voice="loading"] .i-dots { display: inline; }
.talk[data-voice="speaking"] .i-bars, .talk[data-voice="done"] .i-replay { display: inline; }
.talk[data-voice="speaking"] .smile { display: none; }
.talk[data-voice="speaking"] .mouth { display: inline; }
.talk .bubble, .talk .bar, .talk .mouth, .talk .ring, .talk .i-dots circle { transform-box: fill-box; transform-origin: center; }
.talk .bg { fill: var(--ivory); transition: fill 0.8s ease; }
.talk .ring { stroke: var(--ivory); }
.talk[data-cta="1"] .bg { fill: var(--accent); }
.talk[data-cta="1"] .ring { stroke: var(--accent); }
.talk .b-wide { display: none; }
.talk[data-voice="idle"] .wide .b-wide { display: inline; }
.talk[data-voice="idle"] .wide .b-round, .talk[data-voice="idle"] .wide .i-play { display: none; }
.talk .ring-wide { display: none; }
.talk[data-voice="idle"] .ring-wide { display: inline; opacity: 0; }
.scene.talk svg { max-height: 172px; }

button.guide { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; width: 100%; box-sizing: border-box; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; font: inherit; color: inherit; line-height: 1.45; }
button.guide svg { flex: none; max-width: 100%; height: auto; }
/* Keyboard */
.kb-caption { min-height: 18px; font-size: 13px; font-weight: 700; color: var(--muted); }
.kb { position: relative; display: flex; height: 150px; border-radius: 0 0 10px 10px; overflow: hidden; }
.wk { flex: 1; height: 150px; border: 0; border-right: 2px solid var(--bg); border-radius: 0 0 8px 8px; background: var(--ivory); color: var(--accent-ink); padding: 0 0 8px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; font-size: 12px; font-weight: 700; }
.wk span { visibility: hidden; }
.wk.lit { background: var(--accent); }
.wk.lit span { visibility: visible; }
.bk { position: absolute; top: 0; width: 22px; height: 92px; margin-left: -12px; border: 0; border-radius: 0 0 6px 6px; background: var(--ebony); padding: 0; cursor: pointer; }
.bk.lit { background: var(--accent); }
/* Keys respond to the touch itself: no double-tap zoom wait, no text selection or long-press menu. */
.wk, .bk { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

@media (prefers-reduced-motion: no-preference) {
  .node.current { animation: pulse 2.4s ease-in-out infinite; }
  .talk[data-voice="idle"] .bubble { animation: bob 1.8s ease-in-out infinite; }
  .talk[data-voice="idle"] .ring { animation: ring 1.8s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.5); opacity: 0; } }
  .talk[data-voice="idle"] .ring-wide { animation: ringwide 1.8s ease-out infinite; }
  @keyframes ringwide { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.14, 1.5); opacity: 0; } }
  .talk[data-voice="speaking"] .bar { animation: bars 0.7s ease-in-out infinite; }
  .talk[data-voice="speaking"] .bar.b1 { animation-delay: -0.35s; }
  .talk[data-voice="speaking"] .bar.b2 { animation-delay: -0.15s; }
  .talk[data-voice="speaking"] .bar.b3 { animation-delay: -0.5s; }
  .talk[data-voice="speaking"] .mouth { animation: chat 0.75s ease-in-out infinite; }
  .talk[data-voice="loading"] .i-dots circle { animation: dots 1s ease-in-out infinite; }
  .talk[data-voice="loading"] .i-dots .d1 { animation-delay: 0.15s; }
  .talk[data-voice="loading"] .i-dots .d2 { animation-delay: 0.3s; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes bars { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(1); } }
  @keyframes chat { 0%, 100% { transform: rotate(-18deg) scaleY(0.55); } 50% { transform: rotate(-18deg) scaleY(1); } }
  @keyframes dots { 0%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 7px rgba(245, 184, 65, 0.22); } 50% { box-shadow: 0 0 0 11px rgba(245, 184, 65, 0.10); } }
}

/* ---------- New lesson design (test copy): one screen, one action ---------- */
body.in-lesson #home, body.in-lesson .testtag { display: none; }
body.in-lesson .app { padding-top: 8px; padding-bottom: 0; }
.testtag { align-self: flex-start; margin-top: -10px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ok); }
.lesson { display: flex; flex-direction: column; gap: 16px; min-height: calc(100vh - 8px); min-height: calc(100dvh - 8px); }
.ltop { display: flex; align-items: center; gap: 10px; }
.lx.lback { margin-left: -14px; }
.lx { flex: none; width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; color: var(--muted); padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.lbar { flex: 1; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.lbar > div { height: 10px; border-radius: 5px; background: var(--accent); transition: width 0.5s ease; }
h1.lh { font-size: 28px; }
.lp, .lsub p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--soft); }
.lsub { display: flex; flex-direction: column; gap: 8px; }
.lsub:empty { display: none; }
.lsub p { animation: appear 0.6s ease; }
.lscene { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.lpic { align-self: stretch; }
.lpic svg { display: block; width: 100%; height: auto; max-height: 210px; }
.lguide { display: flex; }
.lguide:empty { display: none; }
.lpill { min-height: 52px; padding: 0 22px 0 18px; border-radius: 26px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 17px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.lpill.primary { background: var(--accent); color: var(--accent-ink); }
.lbars rect { fill: currentColor; transform-box: fill-box; transform-origin: center; }
.llink { align-self: center; min-height: 44px; padding: 8px 12px; border: 0; background: transparent; color: var(--muted); font-size: 15px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.llink.strong { font-weight: 700; text-decoration: none; }
.lcenter { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 6px 0; }
.lround { width: 104px; height: 104px; box-sizing: border-box; border-radius: 52px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.lround svg { width: 40px; height: 40px; }
.lround.primary { background: var(--accent); color: var(--accent-ink); }
.lround.listen { border-color: var(--line); color: var(--ok); cursor: default; }
.lround.listen svg { width: 46px; height: 34px; }
.lroundlbl { font-weight: 700; color: var(--muted); }
.lroundlbl.on { color: var(--accent); }
.lcard { background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.lsong { display: flex; gap: 14px; align-items: center; }
.lsongic { flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--ok-bg); color: var(--ok); display: flex; align-items: center; justify-content: center; }
.lsongt { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.2; }
.lsongs { font-size: 14px; color: var(--muted); }
.lctl { display: flex; flex-direction: column; gap: 8px; }
.lgroove { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; box-sizing: border-box; }
.lcard .btn.ready { background: transparent; }
.lnext { text-align: center; font-size: 13px; color: var(--muted); }
.lspot:empty { display: none; }
.lspot iframe { display: block; width: 100%; border: 0; border-radius: 12px; }
.lspot .spotify { align-self: center; color: var(--muted); font-size: 14px; }
.lbottom { position: sticky; bottom: 0; margin-top: auto; padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); background: var(--bg); }
.lgo { width: 100%; min-height: 58px; border: 0; border-radius: 16px; background: var(--line); color: #7D8BA3; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: default; }
.lgo.on { background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.ldots { display: flex; gap: 6px; }
.ldots span { width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: var(--line); }
.ldots .now { background: transparent; border: 2px solid var(--accent); }
.ldots .ok { background: var(--ok); }
.ldots .miss { background: var(--warn); }
.choice.dim { opacity: 0.55; }
.lfeed { position: sticky; bottom: 0; margin: auto -16px 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 14px; animation: appear 0.3s ease; }
.lfeed.good { background: var(--ok-bg); border-top: 2px solid var(--ok); }
.lfeed.bad { background: var(--warn-bg); border-top: 2px solid var(--warn); }
.lfrow { display: flex; gap: 12px; align-items: center; }
.lfic { flex: none; width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: var(--bg); }
.lfeed.good .lfic { background: var(--ok); }
.lfeed.bad .lfic { background: var(--warn); }
.lft { font-family: var(--display); font-weight: 700; font-size: 20px; }
.lfeed.good .lft { color: var(--ok); }
.lfeed.bad .lft { color: var(--warn); }
.lfs { font-size: 15px; color: var(--soft); }
.ltips { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.ltip { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.45; }
.ltip > span { flex: none; width: 7px; height: 7px; border-radius: 4px; background: var(--accent); margin-top: 8px; }
.ltip b { color: var(--accent); }
